name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # install private @kostasgrizos packages

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@kostasgrizos"
      # Needs this repo added under "Manage Actions access" on each private package
      # (github.com/KostasGrizos?tab=packages → package → Package settings).
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test --if-present
      - run: npm run build --if-present

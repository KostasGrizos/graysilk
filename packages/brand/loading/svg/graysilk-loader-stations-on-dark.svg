<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 3" width="52" height="12" shape-rendering="crispEdges" role="img" aria-label="Loading"><title>Loading</title><style>.s{fill:#4A4A52;animation:lit 900ms steps(1,end) infinite}.s2{animation-delay:300ms}.s3{animation-delay:600ms}@keyframes lit{0%,33.3%{fill:#FF5A1F}33.4%,100%{fill:#4A4A52}}@media (prefers-reduced-motion:reduce){.s{animation:none}.s2{fill:#FF5A1F}}</style><rect class="s s1" x="0" y="0" width="3" height="3"/><rect class="s s2" x="5" y="0" width="3" height="3"/><rect class="s s3" x="10" y="0" width="3" height="3"/></svg>
